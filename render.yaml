# Render Blueprint for the API (server/). Render -> New -> Blueprint -> pick this repo.
# Values marked "sync: false" are asked for once in the Render dashboard; they
# are never stored in git. See README "Deployment" for what to put in each.
services:
  - type: web
    name: enoise-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_SIGNUP_CODE
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: HIVEMQ_HOST
        sync: false
      - key: HIVEMQ_PORT
        value: "8883"
      - key: HIVEMQ_USERNAME
        sync: false
      - key: HIVEMQ_PASSWORD
        sync: false
      - key: MQTT_PROTOCOL
        value: mqtts
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_API_KEY
        sync: false
